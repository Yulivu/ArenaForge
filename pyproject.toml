[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arenaforge"
version = "0.2.0"
description = "Contract-first runtime for executable scientific exploration"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arenaforge = "arenaforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
