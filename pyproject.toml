[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arenaforge"
version = "0.1.0"
description = "Generic ML research execution with evidence-backed, reproducible outputs"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "anthropic>=0.52.0",
  "openai>=1.30.0",
  "litellm>=1.55.0",
  "httpx>=0.27.0",
  "requests>=2.28",
  "tiktoken>=0.7.0",
  "pypdf>=4.0",
  "typer>=0.12.0",
  "rich>=13.0",
  "prompt-toolkit>=3.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
arenaforge = "arenaforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
