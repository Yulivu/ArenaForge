[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arenaforge"
version = "0.1.0"
description = "A runnable GOAI Type-2 reference arena for adaptive ecological mechanism discovery"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arenaforge = "arenaforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

