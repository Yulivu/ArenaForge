name: Deploy ArenaForge Product Site

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "examples/quantum_optics_open_exploration/artifacts/**"
      - "scripts/build_demo_snapshot.py"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build reference snapshot
        run: python scripts/build_demo_snapshot.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install product site dependencies
        working-directory: web
        run: npm ci
      - name: Build product site
        working-directory: web
        run: npm run build
      - name: Upload product site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
