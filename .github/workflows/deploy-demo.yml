name: Deploy ArenaForge Demo

on:
  push:
    branches: [master]
    paths:
      - "demo/**"
      - "examples/quantum_optics_open_exploration/artifacts/**"
      - "scripts/build_demo_snapshot.py"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build reference snapshot
        run: python scripts/build_demo_snapshot.py
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
