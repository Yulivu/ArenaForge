schema_version: "0.1"
arena_id: arena-forge-reference-v0
domain: ecology
problem_statement:
  question: >-
    Which mechanism is driving the observed transition toward an algae-dominated
    lake state: external nutrient loading or internal low-oxygen feedback?
  scope: >-
    The agent has partial noisy observations, a finite action budget, and access
    to small interventions that are evaluated on held-out responses.
fixed_context:
  simulator: src/arenaforge/simulator.py
  mechanisms:
    - external_loading
    - internal_feedback
observations:
  - id: lake_state
    type: observation
    fields: [time, nutrient, algae, oxygen, sediment]
actions:
  - id: sample
    preconditions: [budget_remaining]
    inputs: [variable, depth, time_window]
    outputs: [observation]
    cost: 1
  - id: run_pulse
    preconditions: [budget_remaining, intervention_within_limit]
    inputs: [nutrient_delta, oxygenation_delta]
    outputs: [observation]
    cost: 3
feedback:
  - id: deterministic_state_transition
    evaluator: arenaforge.environment.step
  - id: held_out_mechanism_check
    evaluator: arenaforge.verifier.evaluate
discovery_signals:
  - id: positive_mechanism
    required_evidence: [pre_intervention_observation, intervention_response, mechanism_claim]
  - id: negative_mechanism
    required_evidence: [held_out_failure]
  - id: boundary
    required_evidence: [threshold_interval]
  - id: inconclusive
    required_evidence: [budget_exhaustion_or_conflict]
baselines:
  - random_probe
  - fixed_schedule
  - active_information_gain
stop_rules:
  - positive_mechanism
  - negative_mechanism
  - boundary
  - inconclusive
reproducibility:
  seed: 7
  tool_versions: {}

