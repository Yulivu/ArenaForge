schema_version: "0.2"
arena_id: reference-science-arena
title: Reference Scientific Exploration Arena
domain: domain-neutral
problem:
  question: "Which competing explanation best accounts for the observed research phenomenon?"
  objective: "Produce a supported, confounded, boundary, or inconclusive mechanism certificate."
  scope: "A frozen evidence context and finite executable probe budget."
  hypotheses:
    - id: mechanism_a
      statement: "The primary mechanism explains the observed outcome."
    - id: mechanism_b
      statement: "A competing mechanism explains the observed outcome."
context:
  manifest: data/reference_context/manifest.json
  challenge_set: data/reference_context/challenge_cases.json
observations:
  - id: baseline_observation
    type: observation
    schema: observation_record
actions:
  - id: inspect_context
    kind: observe
    preconditions: [problem_defined, budget_remaining]
    inputs: [problem, context]
    outputs: [context_observation]
    cost: {budget: actions, units: 1}
  - id: probe_mechanism_a
    kind: intervene
    preconditions: [context_observation, budget_remaining]
    inputs: [mechanism_a]
    outputs: [mechanism_a_result]
    cost: {budget: actions, units: 2}
  - id: probe_mechanism_b
    kind: intervene
    preconditions: [context_observation, budget_remaining]
    inputs: [mechanism_b]
    outputs: [mechanism_b_result]
    cost: {budget: actions, units: 2}
  - id: compare_probes
    kind: compare
    preconditions: [mechanism_a_result, mechanism_b_result]
    inputs: [mechanism_a_result, mechanism_b_result]
    outputs: [comparison_result]
    cost: {budget: actions, units: 1}
  - id: issue_certificate
    kind: certify
    preconditions: [comparison_result]
    inputs: [comparison_result, evidence_graph]
    outputs: [problem_certificate]
    cost: {budget: actions, units: 1}
feedback:
  - id: observation_check
    applies_to: [context_observation]
    evaluator: deterministic.observation_validator
  - id: comparison_check
    applies_to: [comparison_result]
    evaluator: deterministic.comparison_validator
  - id: certificate_check
    applies_to: [problem_certificate]
    evaluator: deterministic.certificate_validator
discovery_signals:
  - id: supported_mechanism
    kind: supported
    required_evidence:
      artifacts: [comparison_result, problem_certificate]
      min_supporting_probes: 1
  - id: confounded_mechanism
    kind: confounded
    required_evidence:
      artifacts: [comparison_result, problem_certificate]
      min_conflicting_probes: 1
  - id: boundary_found
    kind: boundary
    required_evidence:
      artifacts: [comparison_result, problem_certificate]
      require_scope_revision: true
  - id: inconclusive
    kind: inconclusive
    required_evidence:
      artifacts: [comparison_result]
      allow_budget_exhaustion: true
baselines:
  - id: linear_probe
    description: "Runs the two probes in a fixed order without adaptive scheduling."
  - id: random_probe
    description: "Selects available probes with a seeded random policy."
stop_rules:
  - id: stop_supported
    when: supported_mechanism
    outcome: supported
  - id: stop_confounded
    when: confounded_mechanism
    outcome: confounded
  - id: stop_boundary
    when: boundary_found
    outcome: boundary
  - id: stop_inconclusive
    when: inconclusive
    outcome: inconclusive
reproducibility:
  seed: 7
  budget: 8
  adapter_version: reference-fixture-0.2
  tool_versions:
    runtime: "0.2.0"
